name: Phát hành lên GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chỉ chạy một lượt phát hành tại một thời điểm; lượt mới chờ lượt cũ xong
# để không phát hành đè lên nhau.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kiem-tra-va-build:
    name: Kiểm tra và build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Chạy kiểm thử
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  phat-hanh:
    name: Phát hành
    needs: kiem-tra-va-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.phat-hanh.outputs.page_url }}
    steps:
      - id: phat-hanh
        uses: actions/deploy-pages@v4
